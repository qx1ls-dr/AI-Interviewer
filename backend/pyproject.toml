[project]
name = "ai-interviewer"
version = "0.1.0"
description = "Платформа динамических опросов с AI-интервьюером (серверная часть)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "rq>=1.16",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Тяжёлые зависимости для обезличивания и анализа. Ставятся отдельно:
#   uv sync --extra nlp
nlp = [
    "natasha>=1.6",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
]
# MCP-сервер режима разработки (п. 4.5.3 ТЗ). Не нужен в сборке для эксплуатации.
dev-mcp = [
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
